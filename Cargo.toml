[package]
name = "uu_file"
description = "A Rust implementation of the file utility"
repository = "https://github.com/uutils/coreutils"
edition = "2024"
rust-version = "1.88.0"
version = "0.1.0"
license = "MIT"
keywords = ["file", "uutils", "cross-platform", "cli", "utility"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "file"
path = "src/main.rs"

[lib]
name = "uu_file"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["help", "std", "usage"] }
glob = "0.3.1"
memchr = "2.7.2"
regex = { version = "1.10.4", default-features = false, features = ["std", "perf"] }
walkdir = "2.5"
flate2 = "1.0"

[dev-dependencies]
criterion = { version = "5.0.0", package = "codspeed-criterion-compat" }
uutests = "0.12.0"

[[bench]]
name = "file_bench"
harness = false

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
